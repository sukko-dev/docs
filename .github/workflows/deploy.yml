# =============================================================================
# Deploy Docs — Build + Deploy to Cloudflare Pages
# =============================================================================
# Triggers on push to main and PRs.
# Clones source repos (sukko, sukko-cli, sukko-js) for reference extraction.
# Builds Docusaurus site and deploys to Cloudflare Pages on main push.

name: Deploy Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Clone source repos for reference extraction ---

      # sukko (public) — cloned anonymously, like the SDK/CLI repos below. It was
      # private when this workflow was written; the cutover made it public, so the
      # GitHub App token it used to mint is no longer needed (and the App is not
      # installed on the recreated public repo, which broke this step).
      - name: Clone sukko
        run: git clone --depth 1 https://github.com/sukko-dev/sukko.git .sources/sukko

      # sukko-cli (public)
      - name: Clone sukko-cli
        run: git clone --depth 1 https://github.com/sukko-dev/cli.git .sources/sukko-cli

      # sukko-js (public)
      - name: Clone sukko-js
        run: git clone --depth 1 https://github.com/sukko-dev/sdk-js.git .sources/sukko-js

      # sukko-py (public)
      - name: Clone sukko-py
        run: git clone --depth 1 https://github.com/sukko-dev/sdk-py.git .sources/sukko-py

      # The SDK reference is extracted with TypeDoc, which COMPILES the TypeScript. sukko-js must be
      # installed AND built: the framework packages re-export core types (Message, SukkoClientOptions, …)
      # from @sukko/sdk, which TypeDoc resolves through its emitted dist/index.d.ts — and dist/ is
      # gitignored, so without a build those re-exports silently drop from the framework reference.
      - uses: oven-sh/setup-bun@v2
      - name: Install + build sukko-js
        run: bun install && bun run build
        working-directory: .sources/sukko-js

      # --- Build site (extract.sh handles source repo discovery) ---

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # The Python SDK reference is extracted with griffe, which STATICALLY analyses sukko-py's
      # source — no sukko-py install or build step needed (unlike the TypeScript path above).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install griffe
        run: pip install 'griffe~=2.1'  # pin the major — griffe has changed its API across majors

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # --- Deploy (main only) ---

      - name: Deploy to Cloudflare Pages
        if: false # disabled until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are configured
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=sukko-docs
